name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布到 GitHub Release 的 tag，例如 v0.1.0。留空则只保留 Actions 产物。"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS dmg
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply embed patches
        run: |
          tools/apply-gridcraft-patch.sh
          tools/apply-wordcraft-patch.sh
          tools/apply-deckcraft-patch.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p oneoffice --locked
      - name: Package unsigned dmg
        env:
          PACKAGE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'ci' }}
        run: packaging/macos/package-dmg.sh "$PACKAGE_LABEL"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows setup
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply embed patches
        shell: bash
        run: |
          tools/apply-gridcraft-patch.sh
          tools/apply-wordcraft-patch.sh
          tools/apply-deckcraft-patch.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p oneoffice --locked
      - name: Install NSIS
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          exit $LASTEXITCODE
      - name: Package unsigned installer
        shell: pwsh
        env:
          PACKAGE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'ci' }}
        run: ./packaging/windows/package.ps1 $env:PACKAGE_LABEL
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "tag must look like v0.1.0, got: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release files in dist/" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "OneOffice $RELEASE_TAG" \
              --notes-file packaging/RELEASE_NOTES.md \
              "${files[@]}"
          fi
