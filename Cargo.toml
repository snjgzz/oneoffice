[workspace]
resolver = "3"
members = ["crates/shell"]
# gridcraft is its own workspace. Excluding it lets its crates keep `.workspace = true`
# against vendor/gridcraft/Cargo.toml instead of this file.
exclude = ["vendor/gridcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"
