[package]
name = "oneoffice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OneOffice shell: documents, spreadsheets and presentations in one window."
publish = false

[lib]
name = "oneoffice"
path = "src/lib.rs"

[[bin]]
name = "oneoffice"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rfd.workspace = true
gridcraft-engine = { path = "../../vendor/gridcraft/crates/engine" }
gridcraft-ui-egui = { path = "../../vendor/gridcraft/crates/ui-egui" }
wordcraft-engine = { path = "../../vendor/wordcraft/crates/engine" }
wordcraft-ui-egui = { path = "../../vendor/wordcraft/crates/ui-egui" }
deckcraft-engine = { path = "../../vendor/deckcraft/crates/engine" }
deckcraft-ui-egui = { path = "../../vendor/deckcraft/crates/ui-egui" }
